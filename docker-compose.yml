services:
  server:
    build: ./server
    ports:
      - "8080:8080"
    environment:
      AI_PROVIDER: ${AI_PROVIDER:-mock}
      OPENAI_BASE_URL: ${OPENAI_BASE_URL:-https://api.deepseek.com/v1}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-deepseek-chat}
      JWT_SECRET: ${JWT_SECRET:-please-change-me}
    volumes:
      - server-data:/data
  web:
    build: ./web
    ports:
      - "8081:80"
    depends_on:
      - server
volumes:
  server-data:
